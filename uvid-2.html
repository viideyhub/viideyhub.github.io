<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="Kumpulan video terbaru dan viral">
<title>VIRAL VIDEO</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}
header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,8,8,.96);
  border-bottom:1px solid #222;
  padding:14px
}
.header-inner{
  max-width:1200px;
  margin:auto
}
.logo{
  font-size:24px;
  font-weight:900;
  margin-bottom:12px
}
.logo span{color:#e50914}
.search{
  width:100%;
  padding:13px 15px;
  border:1px solid #333;
  border-radius:10px;
  outline:0;
  background:#151515;
  color:#fff;
  font-size:15px
}
.search:focus{border-color:#e50914}

.container{
  max-width:1200px;
  margin:auto;
  padding:18px 12px 50px
}
.top{margin-bottom:18px}
.top h1{
  margin:0 0 6px;
  font-size:24px
}
.top p{
  margin:0;
  color:#999;
  font-size:14px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px
}

.card{
  background:#141414;
  border:1px solid #222;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:.15s
}
.card:hover{
  transform:translateY(-2px);
  border-color:#444
}

.thumb{
  position:relative;
  aspect-ratio:16/10;
  background:#000;
  overflow:hidden
}
.thumb video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  pointer-events:none
}
.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:46px;
  height:46px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(229,9,20,.9);
  font-size:20px;
  padding-left:3px
}
.number{
  position:absolute;
  left:7px;
  top:7px;
  padding:4px 7px;
  border-radius:5px;
  background:rgba(0,0,0,.75);
  font-size:11px
}
.card-info{padding:10px}
.title{
  font-size:13px;
  font-weight:700;
  line-height:1.35
}
.meta{
  margin-top:5px;
  color:#777;
  font-size:11px
}

.empty{
  display:none;
  text-align:center;
  padding:40px 10px;
  color:#888
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.94)
}
.modal.show{display:flex}
.modal-box{
  width:100%;
  max-width:950px;
  max-height:95vh;
  overflow:auto
}
.close{
  float:right;
  width:40px;
  height:40px;
  margin-bottom:8px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:23px;
  cursor:pointer
}
.player{
  clear:both;
  background:#000;
  border-radius:10px;
  overflow:hidden
}
#player{
  width:100%;
  max-height:72vh;
  display:block;
  background:#000
}
.watch{
  width:100%;
  margin-top:10px;
  padding:15px;
  border:0;
  border-radius:9px;
  background:#e50914;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer
}
.watch:active{transform:scale(.99)}
.modal-title{
  margin:12px 0 0;
  font-size:16px;
  font-weight:700
}

footer{
  padding:30px 15px;
  text-align:center;
  color:#666;
  font-size:12px
}

@media(min-width:600px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(min-width:900px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .container{
    padding-left:18px;
    padding-right:18px
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">🔥 VIRAL<span>VIDEO</span></div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Cari video..."
      autocomplete="off">
  </div>
</header>

<main class="container">

  <section class="top">
    <h1>🎬 Kumpulan Video</h1>
    <p><span id="count">0</span> video tersedia</p>
  </section>

  <section id="grid" class="grid"></section>

  <div id="empty" class="empty">
    Video tidak ditemukan.
  </div>

</main>

<footer>
  © 2026 VIRALVIDEO
</footer>


<!-- VIDEO MODAL -->
<div id="modal" class="modal">

  <div class="modal-box">

    <button id="close" class="close" aria-label="Tutup">×</button>

    <div class="player">
      <video
        id="player"
        controls
        playsinline
        preload="metadata">
      </video>
    </div>

    <button id="watch" class="watch">
      ▶ TONTON SEKARANG

    <div id="modalTitle" class="modal-title"></div>

  </div>

</div>

const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");

const modal = document.getElementById("modal");
const player = document.getElementById("player");
const closeBtn = document.getElementById("close");
const watchBtn = document.getElementById("watch");
const modalTitle = document.getElementById("modalTitle");

let currentVideo = null;


/* =====================================================
   JUDUL OTOMATIS
   ===================================================== */

function makeTitle(index){

  const titles = [
    "Video Viral Terbaru",
    "Video Yang Lagi Ramai",
    "Viral Hari Ini",
    "Video Paling Banyak Ditonton",
    "Koleksi Video Terbaru",
    "Video Trending",
    "Video Viral Indonesia",
    "Video Pilihan Hari Ini"
  ];

  return titles[index % titles.length] +
         " #" + (index + 1);
}


/* =====================================================
   RENDER
   ===================================================== */

function render(list){

  grid.innerHTML = "";

  count.textContent = list.length;

  empty.style.display =
    list.length ? "none" : "block";

  const fragment =
    document.createDocumentFragment();

  list.forEach(function(url){

    const originalIndex =
      videos.indexOf(url);

    const id =
      "video-" + (originalIndex + 1);

    const card =
      document.createElement("article");

    card.className = "card";
    card.dataset.url = url;

    const thumb =
      document.createElement("div");

    thumb.className = "thumb";

    const vid =
      document.createElement("video");

    vid.src = url;
    vid.preload = "metadata";
    vid.muted = true;
    vid.playsInline = true;

    const number =
      document.createElement("div");

    number.className = "number";
    number.textContent =
      "#" + (originalIndex + 1);

    const play =
      document.createElement("div");

    play.className = "play";
    play.textContent = "▶";

    thumb.appendChild(vid);
    thumb.appendChild(number);
    thumb.appendChild(play);

    const info =
      document.createElement("div");

    info.className = "card-info";

    const title =
      document.createElement("div");

    title.className = "title";
    title.textContent =
      makeTitle(originalIndex);

    const meta =
      document.createElement("div");

    meta.className = "meta";
    meta.textContent =
      "▶ Tonton video";

    info.appendChild(title);
    info.appendChild(meta);

    card.appendChild(thumb);
    card.appendChild(info);

    card.addEventListener(
      "click",
      function(){
        openVideo(url,originalIndex);
      }
    );

    fragment.appendChild(card);

  });

  grid.appendChild(fragment);
}


/* =====================================================
   OPEN VIDEO
   ===================================================== */

function openVideo(url,index){

  currentVideo = {
    url:url,
    id:"video-" + (index + 1),
    index:index
  };

  player.src = url;

  modalTitle.textContent =
    makeTitle(index);

  modal.classList.add("show");

  document.body.style.overflow =
    "hidden";

  /*
   * Video mulai setelah user
   * mengklik kartu.
   */

  player.play().catch(function(){});
}


/* =====================================================
   CLOSE
   ===================================================== */

function closeModal(){

  player.pause();

  player.removeAttribute("src");

  player.load();

  modal.classList.remove("show");

  document.body.style.overflow = "";

  currentVideo = null;
}

closeBtn.addEventListener(
  "click",
  closeModal
);

modal.addEventListener(
  "click",
  function(e){

    if(e.target === modal){
      closeModal();
    }

  }
);

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){
      closeModal();
    }

  }
);


/* =====================================================
   CPA BUTTON
   ===================================================== */

watchBtn.addEventListener(
  "click",
  function(){

    if(!currentVideo){
      return;
    }

    triggerCPA(
      currentVideo.id
    );

  }
);


/* =====================================================
   SEARCH
   ===================================================== */

search.addEventListener(
  "input",
  function(){

    const keyword =
      search.value
        .trim()
        .toLowerCase();

    if(!keyword){
      render(videos);
      return;
    }

    const filtered =
      videos.filter(
        function(url,index){

          const title =
            makeTitle(index)
              .toLowerCase();

          return (
            title.includes(keyword) ||
            String(index + 1)
              .includes(keyword)
          );

        }
      );

    render(filtered);

  }
);


/* =====================================================
   START
   ===================================================== */

render(videos);

</script>

</body>
</html>
