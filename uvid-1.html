
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="IndoV1ral - Tonton video pilihan dengan mudah.">

<title>IndoV1ral</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --btn:#111827;
  --btnText:#ffffff;
  --btnHover:#000000;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

html,body{
  min-height:100%;
}

body{
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

.appbar{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid var(--line);
}

.bar-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  padding:10px 16px;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
}

.logo{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  background:#111827;
  color:#fff;
  border-radius:6px;
}

.spacer{
  flex:1;
}

.btn{
  display:inline-block;
  border:0;
  padding:10px 14px;
  border-radius:12px;
  background:var(--btn);
  color:var(--btnText);
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
  font-size:13px;
}

.btn:hover{
  background:var(--btnHover);
}

.banner{
  max-width:1200px;
  margin:10px auto;
  padding:8px 16px;
  color:var(--muted);
  font-size:13px;
}

.banner a{
  color:#2563eb;
  text-decoration:none;
  font-weight:600;
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:16px;
}

.player-shell{
  display:grid;
  place-items:center;
}

.phone{
  width:clamp(240px,92vw,420px);
  aspect-ratio:9/16;
  border-radius:22px;
  overflow:hidden;
  background:#000;
  position:relative;
}

.phone video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.meta{
  margin-top:20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.ad-info{
  max-width:420px;
  margin:24px auto;
  text-align:center;
}

.ad-info p{
  color:var(--muted);
  font-size:12px;
  margin-bottom:12px;
}

.ad-button{
  display:inline-block;
  padding:12px 22px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  border-radius:10px;
}

.ad-button:hover{
  background:#1d4ed8;
}

footer{
  max-width:1200px;
  margin:40px auto 0;
  padding:20px 16px;
  text-align:center;
  font-size:12px;
  color:#94a3b8;
  border-top:1px solid var(--line);
}

@media(max-width:480px){
  .bar-inner{padding:10px 12px}
  .wrap{padding:12px}
  .phone{border-radius:16px}
}
</style>
</head>

<body>

<header class="appbar">
  <div class="bar-inner">
    <div class="brand">
      <span class="logo">V</span>
      <span>vldey<span style="color:#3b82f6">.co</span></span>
    </div>

    <div class="spacer"></div>

    <a class="btn" href="#video">Tonton Video</a>
  </div>
</header>

<div class="banner">
  <span>Advertise · </span>
  <a href="https://quitedrench.org?M16ls=1724713"
     target="_blank"
     rel="nofollow sponsored noopener">
     Kunjungi tautan sponsor
  </a>
</div>

<main class="wrap">

  <section class="player-shell" id="video">
    <div class="phone">
      <video id="videoPlayer" playsinline controls preload="metadata">
        <source src="VIDEO" type="video/mp4">
        Browser tidak mendukung pemutar video.
      </video>
    </div>

    <div class="meta" id="videoMeta">
      0:00 / 0:00 · Putar untuk memulai
    </div>
  </section>

  <section class="ad-info">
    <p>Konten sponsor</p>
    <a class="ad-button"
       href="https://quitedrench.org?M16ls=1724713"
       target="_blank"
       rel="nofollow sponsored noopener">
       Lihat Rekomendasi
    </a>
  </section>

</main>

<footer>
  <p>© 2026 IndoV1ral. Semua hak dilindungi.</p>
</footer>

<script>
const v = document.getElementById('videoPlayer');
const meta = document.getElementById('videoMeta');

function fmt(t){
  if(!Number.isFinite(t)) return "0:00";
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

v.addEventListener('loadedmetadata',()=>{
  meta.textContent = `0:00 / ${fmt(v.duration)} · Putar untuk memulai`;
});

v.addEventListener('timeupdate',()=>{
  meta.textContent = `${fmt(v.currentTime)} / ${fmt(v.duration)}`;
});

v.addEventListener('ended',()=>{
  meta.textContent = `${fmt(v.duration)} / ${fmt(v.duration)} · Selesai`;
});

v.addEventListener('error',()=>{
  meta.textContent = "Video tidak dapat dimuat.";
});
</script>

</body>
</html>
