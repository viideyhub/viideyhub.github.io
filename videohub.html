<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoHub</title>
<style>
:root{
  --bg:#1a1a1a;
  --header:#202020;
  --card:#000;
  --accent:#5c20d6;
  --text:#fff;
  --muted:#b3b3b3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{text-decoration:none;color:inherit}
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:15px 50px;background:var(--header);border-bottom:1px solid #333;
}
.logo{font-size:26px;font-weight:bold;font-style:italic;color:#8b5cf6}
.search-box{display:flex;background:#111;border:1px solid #333;border-radius:4px;overflow:hidden}
.search-box input{background:transparent;border:0;outline:0;color:#fff;padding:10px 15px;width:250px}
.search-box button{border:0;background:var(--accent);color:#fff;padding:10px 18px;cursor:pointer}
nav{
  display:flex;gap:10px;overflow-x:auto;white-space:nowrap;
  padding:10px 50px;background:var(--header);border-bottom:1px solid #222
}
nav a{padding:8px 15px;color:#ddd;font-size:13px;font-weight:bold;border-radius:3px}
nav a:hover,nav a.active{background:var(--accent);color:#fff}
main{padding:30px 50px;min-height:80vh}
.section-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;background:#252525;padding:8px 15px;
  border-left:3px solid var(--accent);border-radius:3px
}
.section-header h2{font-size:14px;font-weight:normal;color:#eee}
.video-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px 15px}
.video-card{cursor:pointer;transition:.2s}
.video-card:hover{transform:translateY(-3px)}
.thumbnail{
  position:relative;width:100%;aspect-ratio:16/9;background:#000;
  overflow:hidden;border-radius:3px
}
.thumbnail video{width:100%;height:100%;object-fit:cover;display:block}
.thumb-overlay{
  position:absolute;inset:auto 0 0;padding:6px 8px;
  display:flex;justify-content:space-between;
  background:linear-gradient(transparent,rgba(0,0,0,.9));
  font-size:11px;font-weight:bold;pointer-events:none
}
.info{text-align:center;padding-top:8px}
.likes{font-size:11px;font-weight:bold;margin-bottom:4px}
.title{font-size:12px;color:var(--muted);line-height:1.4}
.pagination{
  display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:50px 0 20px
}
.pagination button{
  background:#2a2a2a;color:#ccc;border:0;padding:8px 14px;
  border-radius:3px;cursor:pointer;font-size:13px;font-weight:bold
}
.pagination button:hover,.pagination button.active{background:var(--accent);color:#fff}
footer{
  background:#1a1a1a;padding:30px 20px;text-align:center;border-top:1px solid #333
}
.footer-links{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;margin-bottom:15px}
.footer-links a{color:var(--accent);font-size:12px;font-weight:bold}
footer p{color:#666;font-size:11px}

/* PLAYER */
.player-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.92);
  display:none;align-items:center;justify-content:center;
  z-index:99999;padding:18px
}
.player-box{width:min(950px,100%);background:#111;border-radius:8px;overflow:hidden}
.player-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;background:#202020
}
.player-title{font-size:14px;font-weight:bold}
.close-player{
  border:0;background:#333;color:#fff;border-radius:4px;
  padding:7px 11px;cursor:pointer
}
#mainPlayer{display:block;width:100%;max-height:75vh;background:#000}
.player-actions{padding:12px;text-align:center}
.direct-btn{
  display:inline-block;background:var(--accent);color:#fff;
  padding:10px 18px;border-radius:5px;font-weight:bold;font-size:13px
}
.empty{grid-column:1/-1;text-align:center;color:#777;padding:50px 10px}

@media(max-width:1024px){.video-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){
  header,nav,main{padding-left:20px;padding-right:20px}
  header{gap:15px}
  .search-box{width:100%}
  .search-box input{width:100%}
  .video-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
  header{flex-direction:column}
  .video-grid{grid-template-columns:1fr}
  .logo{font-size:22px}
  main{padding-top:20px}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="#" id="logo">VideoHub</a>
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="Search...">
    <button id="searchBtn" type="button">🔍</button>
  </div>
</header>

<nav>
  <a class="active" href="#">🏠 Home</a>
  <a href="#">Terbaru</a>
  <a href="#">Trending</a>
  <a href="#">Video</a>
  <a href="#">Tags</a>
</nav>

<main>
  <div class="section-header">
    <h2 id="pageTitle">Latest videos</h2>
    <span id="pageInfo" style="font-size:12px;color:#aaa"></span>
  </div>

  <div class="video-grid" id="videoGrid"></div>
  <div class="pagination" id="pagination"></div>
</main>

<footer>
  <div class="footer-links">
    <a href="#">DMCA</a>
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Use</a>
  </div>
  <p>© 2026 VideoHub. All rights reserved</p>
</footer>

<div class="player-modal" id="playerModal">
  <div class="player-box">
    <div class="player-head">
      <div class="player-title" id="playerTitle">Video</div>
      <button class="close-player" id="closePlayer">✕</button>
    </div>
    <video id="mainPlayer" controls playsinline preload="metadata"></video>
    <div class="player-actions">
      <a class="direct-btn" href="#" id="directButton" target="_blank" rel="noopener noreferrer">
        TONTON SEKARANG
      </a>
    </div>
  </div>
</div>

<script>
/*
  MASUKKAN URL VIDEO KAMU DI DALAM ARRAY INI.

  Sistem otomatis:
  - 10 video per halaman
  - nomor halaman otomatis
  - Next / Last
  - pencarian
  - player modal
*/
const VIDEO_URLS = [
  // "https://contoh.com/video-01.mp4",
  // "https://contoh.com/video-02.mp4",
  // "https://contoh.com/video-03.mp4",
  // dst...
];

/* Link CTA opsional. Ganti dengan link milikmu sendiri. */
const DIRECT_LINK = "";

const PER_PAGE = 10;
let currentPage = 1;
let filteredVideos = [...VIDEO_URLS];

const grid = document.getElementById("videoGrid");
const pagination = document.getElementById("pagination");
const searchInput = document.getElementById("searchInput");
const pageInfo = document.getElementById("pageInfo");
const modal = document.getElementById("playerModal");
const player = document.getElementById("mainPlayer");
const playerTitle = document.getElementById("playerTitle");
const directButton = document.getElementById("directButton");

function videoTitle(index){
  return "Video " + String(index + 1).padStart(3,"0");
}

function render(){
  const totalPages = Math.max(1, Math.ceil(filteredVideos.length / PER_PAGE));
  if(currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PER_PAGE;
  const items = filteredVideos.slice(start, start + PER_PAGE);

  grid.innerHTML = "";

  if(!items.length){
    grid.innerHTML = '<div class="empty">Belum ada video.</div>';
  }else{
    items.forEach((url,localIndex)=>{
      const absoluteIndex = start + localIndex;
      const card = document.createElement("article");
      card.className = "video-card";

      const thumb = document.createElement("div");
      thumb.className = "thumbnail";

      /*
        Muted autoplay hanya dipakai sebagai preview jika browser mengizinkan.
        Jika server video tidak mengizinkan preview, kartu tetap menampilkan
        latar hitam dan video bisa dibuka melalui player.
      */
      const preview = document.createElement("video");
      preview.src = url;
      preview.muted = true;
      preview.playsInline = true;
      preview.preload = "metadata";

      const overlay = document.createElement("div");
      overlay.className = "thumb-overlay";
      overlay.innerHTML = "<span>▶ Video</span><span>HD</span>";

      thumb.appendChild(preview);
      thumb.appendChild(overlay);

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML =
        '<div class="likes">👍 100%</div>' +
        '<div class="title">' + videoTitle(absoluteIndex) + '</div>';

      card.appendChild(thumb);
      card.appendChild(info);

      card.addEventListener("click",()=>{
        openPlayer(url, videoTitle(absoluteIndex));
      });

      grid.appendChild(card);
    });
  }

  pageInfo.textContent =
    filteredVideos.length
      ? `${start + 1}-${Math.min(start + PER_PAGE, filteredVideos.length)} dari ${filteredVideos.length}`
      : "0 video";

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  pagination.innerHTML = "";

  const addButton = (text,page,active=false,disabled=false)=>{
    const btn = document.createElement("button");
    btn.textContent = text;
    if(active) btn.classList.add("active");
    btn.disabled = disabled;
    btn.addEventListener("click",()=>{
      currentPage = page;
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    });
    pagination.appendChild(btn);
  };

  if(totalPages <= 1) return;

  const maxVisible = 5;
  let start = Math.max(1, currentPage - 2);
  let end = Math.min(totalPages, start + maxVisible - 1);

  if(end - start + 1 < maxVisible){
    start = Math.max(1, end - maxVisible + 1);
  }

  for(let p=start;p<=end;p++){
    addButton(String(p),p,p===currentPage);
  }

  if(currentPage < totalPages){
    addButton("Next",currentPage + 1);
  }

  addButton("Last",totalPages,false,currentPage===totalPages);
}

function openPlayer(url,title){
  playerTitle.textContent = title;
  player.src = url;
  directButton.href = DIRECT_LINK || "#";
  directButton.style.display = DIRECT_LINK ? "inline-block" : "none";
  modal.style.display = "flex";
  document.body.style.overflow = "hidden";

  player.play().catch(()=>{});
}

function closePlayer(){
  player.pause();
  player.removeAttribute("src");
  player.load();
  modal.style.display = "none";
  document.body.style.overflow = "";
}

document.getElementById("closePlayer").addEventListener("click",closePlayer);

modal.addEventListener("click",(e)=>{
  if(e.target === modal) closePlayer();
});

document.addEventListener("keydown",(e)=>{
  if(e.key === "Escape") closePlayer();
});

function doSearch(){
  const q = searchInput.value.trim().toLowerCase();

  if(!q){
    filteredVideos = [...VIDEO_URLS];
  }else{
    filteredVideos = VIDEO_URLS.filter((url,index)=>{
      return (
        videoTitle(index).toLowerCase().includes(q) ||
        url.toLowerCase().includes(q)
      );
    });
  }

  currentPage = 1;
  render();
}

searchInput.addEventListener("input",doSearch);
document.getElementById("searchBtn").addEventListener("click",doSearch);

render();
</script>

</body>
</html>
