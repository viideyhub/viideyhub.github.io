<style>
:root{
    --bg-body:#1a1a1a;
    --bg-header:#202020;
    --accent-color:#5c20d6;
    --text-main:#fff;
    --text-muted:#b3b3b3;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg-body);
    color:var(--text-main);
    line-height:1.5;
}

a{
    text-decoration:none;
    color:inherit;
}

/* HEADER */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 50px;
    background:var(--bg-header);
    border-bottom:1px solid #333;
}

.logo{
    font-size:26px;
    font-weight:bold;
    font-style:italic;
    color:#8b5cf6;
    cursor:pointer;
    user-select:none;
}

.search-box{
    display:flex;
    background:#111;
    border-radius:4px;
    overflow:hidden;
    border:1px solid #333;
}

.search-box input{
    background:transparent;
    border:none;
    padding:10px 15px;
    color:#fff;
    width:250px;
    outline:none;
    font-size:14px;
}

.search-box button{
    background:var(--accent-color);
    border:none;
    padding:10px 20px;
    color:#fff;
    cursor:pointer;
}

/* NAV */

nav{
    background:var(--bg-header);
    padding:10px 50px;
    display:flex;
    gap:10px;
    border-bottom:1px solid #222;
    overflow-x:auto;
    white-space:nowrap;
    align-items:center;
    min-height:50px;
}

nav a{
    padding:8px 15px;
    font-size:13px;
    font-weight:bold;
    color:#ddd;
    border-radius:3px;
    border:1px solid transparent;
}

nav a.active,
nav a:hover{
    background:var(--accent-color);
    color:#fff;
}

/* EDIT */

.edit-block{
    display:inline-flex;
    flex-direction:column;
    gap:4px;
    vertical-align:top;
    margin-right:5px;
}

.edit-sm-input{
    background:#111;
    color:#fff;
    border:1px solid var(--accent-color);
    padding:6px;
    font-size:12px;
    border-radius:3px;
    outline:none;
    text-align:center;
    width:100px;
}

.edit-sm-link{
    border-color:#2ecc71;
}

/* MAIN */

main{
    padding:30px 50px;
    min-height:80vh;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    background:#252525;
    padding:8px 15px;
    border-radius:3px;
    border-left:3px solid var(--accent-color);
}

.section-header h2{
    font-size:14px;
    font-weight:normal;
    color:#eee;
}

.filter-btn{
    background:#111;
    border:1px solid #444;
    color:#fff;
    padding:4px 12px;
    border-radius:3px;
    cursor:pointer;
}

/* VIDEO GRID */

.video-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:30px 15px;
}

.video-card{
    background:transparent;
    position:relative;
    cursor:pointer;
    transition:.2s;
}

.video-card:hover{
    transform:translateY(-3px);
}

.video-card.editing:hover{
    transform:none;
    cursor:default;
}

.thumbnail{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
    border-radius:3px;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.2s;
}

.overlay-stats{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    justify-content:space-between;
    padding:6px 8px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.9)
    );
    font-size:11px;
    font-weight:bold;
    pointer-events:none;
}

.info{
    padding-top:8px;
    text-align:center;
}

.likes{
    color:#fff;
    font-size:11px;
    font-weight:bold;
    margin-bottom:4px;
}

.title{
    font-size:12px;
    color:var(--text-muted);
    line-height:1.4;
    word-wrap:break-word;
}

/* EDIT OVERLAY */

.edit-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(92,32,214,.75);
    color:#fff;
    font-weight:bold;
    font-size:14px;
    text-align:center;
    cursor:pointer;
}

.video-card:not(.editing) .edit-overlay{
    display:none;
}

.video-card.editing .thumbnail img{
    opacity:.3;
}

.edit-input-title,
.edit-input-link{
    display:block;
    width:100%;
    background:#222;
    color:#fff;
    padding:7px;
    font-size:11px;
    text-align:center;
    margin-top:5px;
    outline:none;
    border-radius:3px;
}

.edit-input-title{
    border:1px solid var(--accent-color);
}

.edit-input-link{
    border:1px solid #2ecc71;
}

/* PAGINATION */

.pagination{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px;
    margin:50px 0 20px;
}

.pagination button{
    background:#2a2a2a;
    color:#ccc;
    border:none;
    padding:8px 14px;
    border-radius:3px;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
}

.pagination button:hover,
.pagination button.active{
    background:var(--accent-color);
    color:#fff;
}

/* FOOTER */

footer{
    background:#1a1a1a;
    padding:30px 20px;
    text-align:center;
    border-top:1px solid #333;
}

.footer-links{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:15px;
}

.footer-links a{
    color:var(--accent-color);
    font-size:12px;
    font-weight:bold;
}

footer p{
    color:#666;
    font-size:11px;
}

/* ADMIN */

.fab-container{
    position:fixed;
    bottom:20px;
    right:20px;
    display:none;
    flex-direction:column;
    gap:10px;
    z-index:99999;
}

.fab-btn{
    background:var(--accent-color);
    color:#fff;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
    font-size:14px;
}

.fab-btn.save{
    background:#2ecc71;
    display:none;
}

.fab-btn.download{
    background:#e74c3c;
    display:none;
}

/* MOBILE */

@media(max-width:1024px){
    .video-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:768px){

    header,
    nav,
    main{
        padding-left:20px;
        padding-right:20px;
    }

    .video-grid{
        grid-template-columns:repeat(2,1fr);
    }

    header{
        gap:15px;
    }

    .search-box{
        width:100%;
    }

    .search-box input{
        width:100%;
    }
}

@media(max-width:480px){

    .video-grid{
        grid-template-columns:1fr;
    }

    header{
        flex-direction:column;
    }

    .logo{
        font-size:22px;
    }

    main{
        padding-top:20px;
    }
}
</style>

<script>

/* =========================================================
   KUNCI ADMIN
   Klik 🔍 5 kali
   ========================================================= */

let jumlahKlik = 0;
let waktuResetKlik = null;

document
    .getElementById("btnSecret")
    .addEventListener("click", function(){

        jumlahKlik++;

        clearTimeout(waktuResetKlik);

        if(jumlahKlik >= 5){

            jumlahKlik = 0;

        }else{

            waktuResetKlik = setTimeout(
                function(){
                    jumlahKlik = 0;
                },
                1500
            );

        }

    });


/* =========================================================
   DATA
   ========================================================= */

function ambilData(key,fallback){

    try{

        const data =
            localStorage.getItem(key);

        return data
            ? JSON.parse(data)
            : fallback;

    }catch(error){

        return fallback;

    }

}


let headerData = ambilData(
    "dataHeaderLokal",
    window.DATA_HEADER
);

let menuData = ambilData(
    "dataMenuObjLokal",
    window.DATA_MENU
);

let pagData = ambilData(
    "dataPagLokal",
    window.DATA_PAGINATION
);

let videoData = ambilData(
    "dataVideoLokal",
    window.DATA_VIDEO
);


const wadahLogo =
    document.getElementById("tempat-logo");

const wadahVideo =
    document.getElementById("tempat-video");

const wadahMenu =
    document.getElementById("menu-navigasi");

const wadahPag =
    document.getElementById("tempat-pagination");

let isEditMode = false;


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   REDIRECT
   ========================================================= */

function arahkanKeLink(url){

    if(isEditMode) return;

    if(
        typeof url !== "string" ||
        !url.trim()
    ){
        return;
    }

    try{

        const link =
            new URL(
                url,
                window.location.href
            );

        if(
            link.protocol === "http:" ||
            link.protocol === "https:"
        ){

            window.open(
                link.href,
                "_blank",
                "noopener,noreferrer"
            );

        }

    }catch(error){

        console.warn(
            "Link tidak valid:",
            url
        );

    }

}


/* =========================================================
   HEADER
   ========================================================= */

function tampilkanHeader(){

    if(isEditMode){

        wadahLogo.innerHTML = `

            <div
                class="edit-block"
                style="
                    flex-direction:row;
                    gap:5px;
                    align-items:center;
                "
            >

                <input
                    type="text"
                    class="edit-sm-input"
                    id="input-header-text"
                    value="${escapeHTML(headerData.text)}"
                    placeholder="Nama Judul"
                    style="
                        font-size:16px;
                        font-weight:bold;
                        width:150px;
                        font-style:italic;
                    "
                >

                <input
                    type="text"
                    class="edit-sm-input edit-sm-link"
                    id="input-header-link"
                    value="${escapeHTML(headerData.link)}"
                    placeholder="🔗 Link Redirect"
                    style="width:150px;"
                >

            </div>

        `;

    }else{

        wadahLogo.innerHTML = `

            <a
                href="#"
                class="logo"
                id="logoLink"
            >
                ${escapeHTML(headerData.text)}
            </a>

        `;

        document
            .getElementById("logoLink")
            .addEventListener(
                "click",
                function(e){

                    e.preventDefault();

                    if(headerData.link){

                        arahkanKeLink(
                            headerData.link
                        );

                    }

                }
            );

    }

}


/* =========================================================
   MENU
   ========================================================= */

function tampilkanMenu(){

    wadahMenu.innerHTML = "";

    const home =
        document.createElement("a");

    home.href = "#";
    home.className = "active";
    home.textContent = "🏠 Home";

    home.addEventListener(
        "click",
        function(e){

            e.preventDefault();

            if(!isEditMode){

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            }

        }
    );

    wadahMenu.appendChild(home);


    menuData.forEach(
        function(menu,index){

            if(isEditMode){

                wadahMenu.innerHTML += `

                    <div class="edit-block">

                        <input
                            type="text"
                            class="edit-sm-input"
                            id="input-menu-text-${index}"
                            value="${escapeHTML(menu.text)}"
                            placeholder="Nama Menu"
                        >

                        <input
                            type="text"
                            class="edit-sm-input edit-sm-link"
                            id="input-menu-link-${index}"
                            value="${escapeHTML(menu.link)}"
                            placeholder="🔗 Link Redirect"
                        >

                    </div>

                `;

            }else{

                const a =
                    document.createElement("a");

                a.href = "#";
                a.textContent = menu.text;

                a.addEventListener(
                    "click",
                    function(e){

                        e.preventDefault();

                        if(menu.link){

                            arahkanKeLink(
                                menu.link
                            );

                        }

                    }
                );

                wadahMenu.appendChild(a);

            }

        }
    );

}


/* =========================================================
   PAGINATION
   ========================================================= */

function tampilkanPagination(){

    wadahPag.innerHTML = "";

    pagData.forEach(
        function(pag,index){

            if(isEditMode){

                const block =
                    document.createElement("div");

                block.className =
                    "edit-block";

                block.style.width = "80px";

                block.innerHTML = `

                    <input
                        type="text"
                        class="edit-sm-input"
                        id="input-pag-text-${index}"
                        value="${escapeHTML(pag.text)}"
                        style="width:100%;"
                    >

                    <input
                        type="text"
                        class="edit-sm-input edit-sm-link"
                        id="input-pag-link-${index}"
                        value="${escapeHTML(pag.link)}"
                        placeholder="🔗 Link"
                        style="width:100%;"
                    >

                `;

                wadahPag.appendChild(block);

            }else{

                const button =
                    document.createElement("button");

                if(pag.active){
                    button.className = "active";
                }

                button.textContent =
                    pag.text;

                button.addEventListener(
                    "click",
                    function(){

                        if(pag.link){

                            arahkanKeLink(
                                pag.link
                            );

                        }

                    }
                );

                wadahPag.appendChild(button);

            }

        }
    );

}


/* =========================================================
   GRID VIDEO
   ========================================================= */

function tampilkanGrid(){

    wadahVideo.innerHTML = "";

    videoData.forEach(
        function(video,index){

            const card =
                document.createElement("div");

            card.className =
                "video-card " +
                (isEditMode
                    ? "editing"
                    : "");

            const gambar =
                video.gambar &&
                video.gambar.trim()
                    ? video.gambar
                    : "https://via.placeholder.com/640x360/000000/333333?text=Klik+Ganti+Gambar";


            card.innerHTML = `

                <div class="thumbnail">

                    <img
                        src="${escapeHTML(gambar)}"
                        alt="${escapeHTML(video.judul)}"
                        loading="lazy"
                        onerror="
                            this.src='https://via.placeholder.com/640x360/000000/333333?text=Gambar+Tidak+Tersedia'
                        "
                    >

                    <div class="overlay-stats">

                        <span>
                            👁 ${escapeHTML(video.views)}
                        </span>

                        <span>
                            ⏱ ${escapeHTML(video.durasi)}
                        </span>

                    </div>


                    ${
                        isEditMode
                        ? `

                            <div
                                class="edit-overlay"
                                data-image="${index}"
                            >
                                🔗 Tempel Link Gambar
                            </div>

                        `
                        : ""
                    }

                </div>


                <div class="info">

                    <div class="likes">
                        👍 ${escapeHTML(video.likes)}
                    </div>

                    <div class="title">
                        ${escapeHTML(video.judul)}
                    </div>


                    ${
                        isEditMode
                        ? `

                            <input
                                type="text"
                                class="edit-input-title"
                                id="input-judul-${index}"
                                value="${escapeHTML(video.judul)}"
                                placeholder="Ketik judul baru..."
                            >

                            <input
                                type="text"
                                class="edit-input-link"
                                id="input-link-${index}"
                                value="${escapeHTML(video.link || "")}"
                                placeholder="🔗 Masukkan Link Redirect..."
                            >

                        `
                        : ""
                    }

                </div>

            `;


            card.addEventListener(
                "click",
                function(){

                    if(
                        !isEditMode &&
                        video.link
                    ){

                        arahkanKeLink(
                            video.link
                        );

                    }

                }
            );


            const editImage =
                card.querySelector(
                    `[data-image="${index}"]`
                );


            if(editImage){

                editImage.addEventListener(
                    "click",
                    function(e){

                        e.stopPropagation();

                        gantiGambarURL(index);

                    }
                );

            }


            const info =
                card.querySelector(".info");

            if(info){

                info.addEventListener(
                    "click",
                    function(e){

                        if(isEditMode){

                            e.stopPropagation();

                        }

                    }
                );

            }


            wadahVideo.appendChild(card);

        }
    );

}


/* =========================================================
   EDIT MODE
   ========================================================= */

function toggleEditMode(){

    isEditMode = true;

    document
        .getElementById("btnEdit")
        .style.display = "none";

    document
        .getElementById("btnSimpan")
        .style.display = "block";

    document
        .getElementById("btnDownload")
        .style.display = "block";


    tampilkanHeader();
    tampilkanMenu();
    tampilkanPagination();
    tampilkanGrid();

}


/* =========================================================
   SIMPAN
   ========================================================= */

function simpanPerubahan(){

    const headerText =
        document.getElementById(
            "input-header-text"
        );

    const headerLink =
        document.getElementById(
            "input-header-link"
        );


    if(headerText){
        headerData.text =
            headerText.value.trim();
    }

    if(headerLink){
        headerData.link =
            headerLink.value.trim();
    }


    videoData.forEach(
        function(video,index){

            const judul =
                document.getElementById(
                    `input-judul-${index}`
                );

            const link =
                document.getElementById(
                    `input-link-${index}`
                );

            if(judul){
                video.judul =
                    judul.value.trim();
            }

            if(link){
                video.link =
                    link.value.trim();
            }

        }
    );


    menuData.forEach(
        function(menu,index){

            const text =
                document.getElementById(
                    `input-menu-text-${index}`
                );

            const link =
                document.getElementById(
                    `input-menu-link-${index}`
                );

            if(text){
                menu.text =
                    text.value.trim();
            }

            if(link){
                menu.link =
                    link.value.trim();
            }

        }
    );


    pagData.forEach(
        function(pag,index){

            const text =
                document.getElementById(
                    `input-pag-text-${index}`
                );

            const link =
                document.getElementById(
                    `input-pag-link-${index}`
                );

            if(text){
                pag.text =
                    text.value.trim();
            }

            if(link){
                pag.link =
                    link.value.trim();
            }

        }
    );


    localStorage.setItem(
        "dataHeaderLokal",
        JSON.stringify(headerData)
    );

    localStorage.setItem(
        "dataVideoLokal",
        JSON.stringify(videoData)
    );

    localStorage.setItem(
        "dataMenuObjLokal",
        JSON.stringify(menuData)
    );

    localStorage.setItem(
        "dataPagLokal",
        JSON.stringify(pagData)
    );


    isEditMode = false;


    document
        .getElementById("btnEdit")
        .style.display = "block";

    document
        .getElementById("btnSimpan")
        .style.display = "none";

    document
        .getElementById("btnDownload")
        .style.display = "none";


    tampilkanHeader();
    tampilkanMenu();
    tampilkanPagination();
    tampilkanGrid();


    alert(
        "✅ Data berhasil disimpan di browser ini."
    );

}


/* =========================================================
   GANTI GAMBAR
   ========================================================= */

function gantiGambarURL(index){

    const lama =
        videoData[index].gambar || "";

    const baru =
        prompt(
            "MASUKKAN LINK GAMBAR (URL):",
            lama
        );


    if(
        baru !== null &&
        baru.trim() !== ""
    ){

        videoData[index].gambar =
            baru.trim();

        tampilkanGrid();

    }

}


/* =========================================================
   DOWNLOAD HTML PUBLIK
   ========================================================= */

function downloadWebFinal(){

    /*
       Simpan terlebih dahulu
    */

    if(isEditMode){

        simpanPerubahan();

    }


    /*
       Update DATA
    */

    const scriptData =
        document.getElementById(
            "data-situs"
        );


    if(scriptData){

        scriptData.textContent = `

window.DATA_HEADER =
${JSON.stringify(headerData)};

window.DATA_MENU =
${JSON.stringify(menuData)};

window.DATA_PAGINATION =
${JSON.stringify(pagData)};

window.DATA_VIDEO =
${JSON.stringify(videoData)};

        `.trim();

    }


    /*
       Clone halaman
    */

    const clone =
        document.documentElement
        .cloneNode(true);


    /*
       Hapus panel admin
    */

    const panel =
        clone.querySelector(
            "#panelAdmin"
        );

    if(panel){
        panel.remove();
    }


    /*
       Hapus tombol rahasia
    */

    const secret =
        clone.querySelector(
            "#btnSecret"
        );

    if(secret){
        secret.remove();
    }


    /*
       Hapus semua elemen edit
    */

    clone
        .querySelectorAll(
            ".edit-input-title," +
            ".edit-input-link," +
            ".edit-overlay," +
            ".edit-block"
        )
        .forEach(
            function(el){
                el.remove();
            }
        );


    /*
       Hapus class editing
    */

    clone
        .querySelectorAll(".editing")
        .forEach(
            function(el){
                el.classList.remove(
                    "editing"
                );
            }
        );


    /*
       Hapus script admin
    */

    clone
        .querySelectorAll("script")
        .forEach(
            function(script){

                const isi =
                    script.textContent || "";

                if(
                    isi.includes(
                        "KUNCI ADMIN"
                    ) ||
                    isi.includes(
                        "toggleEditMode"
                    ) ||
                    isi.includes(
                        "downloadWebFinal"
                    )
                ){

                    script.remove();

                }

            }
        );


    /*
       Buat file
    */

    const hasil =
        "<!DOCTYPE html>\n" +
        clone.outerHTML;


    const blob =
        new Blob(
            [hasil],
            {
                type:
                "text/html;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "index-publik.html";

    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(url);

        },
        1000
    );


    alert(
        "✅ HTML publik berhasil dibuat.\n\n" +
        "Nama file: index-publik.html"
    );

}


/* =========================================================
   EVENT ADMIN
   ========================================================= */

document
    .getElementById("btnEdit")
    .addEventListener(
        "click",
        toggleEditMode
    );


document
    .getElementById("btnSimpan")
    .addEventListener(
        "click",
        simpanPerubahan
    );


document
    .getElementById("btnDownload")
    .addEventListener(
        "click",
        downloadWebFinal
    );


/* =========================================================
   SEARCH
   ========================================================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        function(){

            const keyword =
                this.value
                    .toLowerCase()
                    .trim();

            const cards =
                document.querySelectorAll(
                    ".video-card"
                );


            cards.forEach(
                function(card,index){

                    const judul =
                        (
                            videoData[index]
                            ?.judul || ""
                        )
                        .toLowerCase();


                    card.style.display =
                        !keyword ||
                        judul.includes(keyword)
                            ? ""
                            : "none";

                }
            );

        }
    );


/* =========================================================
   INIT
   ========================================================= */

tampilkanHeader();
tampilkanMenu();
tampilkanPagination();
tampilkanGrid();

</script>
