<html lang="id">
<head>

  <script data-cfasync="false"

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --btn: #111827;
      --card: #f8fafc;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      width: 100%;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      max-width: 100%;
    }

    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.45;
      overflow-x: hidden;
    }

    .appbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.92);
      backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .bar-inner {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .logo {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 6px;
      background: #111827;
      color: #fff;
      font-size: 14px;
    }

    .spacer { flex: 1; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 0;
      padding: 10px 11px;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font: 600 13px Inter, sans-serif;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
    }

    .telegram-btn { background: #229ED9; }

    .banner {
      width: 100%;
      max-width: 1200px;
      margin: 10px auto 0;
      padding: 8px 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 6px auto 40px;
      padding-inline: 16px;
    }

    .player-shell {
      display: grid;
      place-items: center;
      margin-top: 20px;
    }

    .phone {
      position: relative;
      width: clamp(240px, 92vw, 420px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(2,6,23,.15),
                  0 3px 10px rgba(2,6,23,.08);
    }

    .phone video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .meta {
      width: 100%;
      max-width: 760px;
      margin: 12px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .dl-section {
      width: 100%;
      max-width: 420px;
      margin: 12px auto 0;
      padding-inline: 10px;
      text-align: center;
    }

    .dl-title {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 10px;
    }

    .dl-wrap {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn-dl {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      text-align: center;
      padding: 16px 10px;
      border-radius: 16px;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      transition: transform .2s ease;
      touch-action: manipulation;
    }

    .btn-dl:active { transform: scale(.98); }

    .btn-dl-1 {
      background: linear-gradient(135deg, #ff4d4d, #ff7a00);
      box-shadow: 0 6px 18px rgba(255,77,77,.25);
    }

    .btn-dl-2 {
      background: linear-gradient(135deg, #3b82f6, #0ea5e9);
      box-shadow: 0 6px 18px rgba(59,130,246,.25);
    }

    .ad-slot {
      width: 100%;
      max-width: 420px;
      margin: 28px auto 0;
      background: var(--card);
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .footer {
      text-align: center;
      padding: 20px 16px;
      color: var(--muted);
      font-size: 12px;
    }

    /* HISTATS */
    #histats_counter {
      margin: 18px auto;
      text-align: center;
      font-size: 12px;
    }

    /* POPUP KONFIRMASI USIA */
    #age18-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease;
    }

    #age18-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .age18-card {
      width: min(360px, 100%);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      padding: 22px 20px 18px;
      transform: scale(.95);
      transition: transform .2s ease;
    }

    #age18-overlay.show .age18-card {
      transform: scale(1);
    }

    .age18-card h3 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #111827;
    }

    .age18-card p {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.6;
      color: #4b5563;
    }

    .age18-actions {
      display: flex;
      gap: 12px;
    }

    .age18-btn {
      flex: 1;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font: 700 15px Inter, sans-serif;
    }

    .age18-btn.batal {
      background: #e5e7eb;
      color: #111827;
    }

    .age18-btn.lanjut {
      background: #ef4444;
      color: #fff;
    }

    @media (min-width: 1024px) {
      .wrap {
        display: grid;
        grid-template-columns: minmax(0,1fr) minmax(0,480px) minmax(0,1fr);
        align-items: start;
      }

      .player-shell { grid-column: 2; }
    }

    @media (max-width: 360px) {
      .bar-inner { gap: 5px; padding-inline: 8px; }
      .brand { font-size: 13px; gap: 5px; }
      .btn { padding: 9px 8px; font-size: 12px; }
    }
  </style>
</head>

<body>

  <!-- DURASI VIDEO -->
  <script>
    const video = document.getElementById('video');
    const duration = document.getElementById('duration');

    function fmt(seconds) {
      if (!Number.isFinite(seconds)) return '0:00';

      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, '0');

      return `${minutes}:${secs}`;
    }

    video.addEventListener('loadedmetadata', () => {
      duration.textContent = `0:00 / ${fmt(video.duration)}`;
    });

    video.addEventListener('timeupdate', () => {
      duration.textContent =
        `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
    });
  </script>

  <!-- POPUP USIA: TAMPIL SETELAH 35 DETIK -->
  <script>
    (function () {
      const overlay = document.getElementById('age18-overlay');
      const btnLanjut = document.getElementById('ageLanjut');
      const btnBatal = document.getElementById('ageBatal');

      window.setTimeout(function () {
        overlay.classList.add('show');
        document.documentElement.style.overflow = 'hidden';
      }, 35000);

      function closePopup() {
        overlay.classList.remove('show');
        document.documentElement.style.overflow = '';
      }

      btnLanjut.addEventListener('click', closePopup);
      btnBatal.addEventListener('click', closePopup);
    })();
  </script>
