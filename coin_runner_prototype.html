<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coin Runner - Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.app{width:min(480px,100vw);height:100vh;margin:auto;background:#10151d;position:relative;overflow:hidden}
.top{position:absolute;z-index:4;top:0;left:0;right:0;padding:14px;display:flex;justify-content:space-between;pointer-events:none}
.pill{background:#111923dd;border:1px solid #33404e;border-radius:14px;padding:8px 12px;font-weight:700;box-shadow:0 5px 20px #0005}
.pill small{display:block;color:#8e9baa;font-size:10px;font-weight:400}.pill b{font-size:17px}
canvas{display:block;width:100%;height:100%}
.bottom{position:absolute;z-index:5;bottom:0;left:0;right:0;padding:12px 16px 18px;background:linear-gradient(transparent,#090c12 35%);text-align:center}
.help{font-size:12px;color:#aab4c0;margin-bottom:8px}.controls{display:flex;gap:12px;justify-content:center}
.ctrl{width:64px;height:50px;border:1px solid #354252;border-radius:14px;background:#17202c;color:white;font-size:22px;font-weight:bold}
.ctrl:active{transform:scale(.94);background:#263547}
.start{position:absolute;inset:0;z-index:10;background:linear-gradient(#07101bd9,#080b11f2);display:flex;align-items:center;justify-content:center;padding:25px}
.panel{width:100%;max-width:350px;background:#121a25;border:1px solid #344455;border-radius:24px;padding:25px;text-align:center;box-shadow:0 20px 60px #0009}
.logo{font-size:35px;font-weight:900}.logo span{color:#ffd43b}.subtitle{color:#aeb9c5;margin:7px 0 22px}
.mainbtn{width:100%;border:0;border-radius:16px;padding:16px;background:linear-gradient(135deg,#ffd43b,#ff9d00);font-size:18px;font-weight:900;color:#18120a}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.stat{background:#0d131c;border-radius:13px;padding:12px}.stat small{display:block;color:#8e9baa}.stat b{display:block;margin-top:4px}
.gameover{display:none}
.reward{position:absolute;z-index:9;left:50%;top:43%;transform:translate(-50%,-50%);background:#131c27;border:1px solid #46576b;border-radius:20px;padding:22px;width:82%;text-align:center;box-shadow:0 15px 50px #000b}
.reward h2{margin:0 0 8px}.reward p{color:#b8c1cb}.reward button{border:0;border-radius:12px;padding:12px 20px;background:#ffd43b;font-weight:800;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<div class="top">
  <div class="pill"><small>KOIN</small><b id="coins">0</b> 🪙</div>
  <div class="pill"><small>SKOR</small><b id="score">0</b></div>
</div>
<canvas id="game"></canvas>

<div class="bottom">
 <div class="help">Geser ← → untuk pindah jalur • Hindari 🚧 • Ambil 🪙</div>
 <div class="controls"><button class="ctrl" id="left">←</button><button class="ctrl" id="jump">↑</button><button class="ctrl" id="right">→</button></div>
</div>

<div class="start" id="start">
 <div class="panel">
  <div class="logo">COIN <span>RUNNER</span></div>
  <div class="subtitle">Lari sejauh mungkin, kumpulkan koin dan selesaikan misi.</div>
  <div class="stats"><div class="stat"><small>Saldo</small><b id="startCoins">0 🪙</b></div><div class="stat"><small>Rekor</small><b id="best">0</b></div></div>
  <button class="mainbtn" id="play">▶ MULAI MAIN</button>
 </div>
</div>

<div class="reward hidden" id="reward">
 <h2>🏁 Run selesai!</h2><p id="result"></p>
 <button id="again">MAIN LAGI</button>
 <button id="bonus">🎁 BONUS +50</button>
</div>
</div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr,run=false,raf,player,objects=[],score=0,coins=0,speed=5,spawn=0,last=0;
let state=JSON.parse(localStorage.getItem('coinRunner')||'null')||{coins:0,best:0,bonus:false};
function resize(){dpr=devicePixelRatio||1;W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function lanes(){return [W*.27,W*.5,W*.73]}
function reset(){let l=lanes();player={lane:1,x:l[1],y:H*.72,w:42,h:58,jump:0};objects=[];score=0;speed=5;spawn=0}
function draw(){
 ctx.clearRect(0,0,W,H);
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#15283a');g.addColorStop(.55,'#15202b');g.addColorStop(1,'#080c11');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // city
 ctx.fillStyle='#111b25';for(let x=0;x<W;x+=55){let hh=35+((x*7)%70);ctx.fillRect(x,H*.34-hh,42,hh)}
 // road
 ctx.fillStyle='#252b31';ctx.beginPath();ctx.moveTo(W*.12,H*.34);ctx.lineTo(W*.88,H*.34);ctx.lineTo(W*.98,H);ctx.lineTo(W*.02,H);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#e6e0a3';ctx.lineWidth=3;ctx.setLineDash([18,18]);
 ctx.beginPath();ctx.moveTo(W*.38,H*.34);ctx.lineTo(W*.34,H);ctx.moveTo(W*.62,H*.34);ctx.lineTo(W*.66,H);ctx.stroke();ctx.setLineDash([]);
 objects.forEach(o=>{
   let yy=o.y;
   if(o.type==='coin'){ctx.fillStyle='#ffd43b';ctx.beginPath();ctx.arc(o.x,yy,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8a5c00';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('C',o.x,yy+4)}
   else{ctx.fillStyle='#ff4d4d';ctx.fillRect(o.x-19,yy-17,38,34);ctx.fillStyle='#222';ctx.fillRect(o.x-14,yy-8,28,5);ctx.fillStyle='#ffce3a';ctx.fillRect(o.x-12,yy+5,9,5);ctx.fillRect(o.x+3,yy+5,9,5)}
 });
 // player
 let py=player.y-player.jump;
 ctx.fillStyle='#35c9ff';ctx.beginPath();ctx.arc(player.x,py-22,15,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#167ca0';ctx.fillRect(player.x-16,py-7,32,35);
 ctx.fillStyle='#0b1118';ctx.fillRect(player.x-12,py-2,24,8);
 ctx.fillStyle='#35c9ff';ctx.fillRect(player.x-14,py+28,10,17);ctx.fillRect(player.x+4,py+28,10,17);
}
function spawnObj(){let l=lanes(),lane=Math.floor(Math.random()*3);objects.push({type:Math.random()<.65?'coin':'obs',lane,x:l[lane],y:H*.30-20});if(Math.random()<.35)objects.push({type:'coin',lane:(lane+1)%3,x:l[(lane+1)%3],y:H*.30-70})}
function collide(o){let py=player.y-player.jump;return Math.abs(o.x-player.x)<32&&Math.abs(o.y-(py-5))<42}
function loop(t){if(!run)return;let dt=Math.min(32,t-last);last=t;speed+=dt*.0003;score+=dt*.012;spawn-=dt;if(spawn<=0){spawnObj();spawn=650-Math.min(250,score*2)}
 objects.forEach(o=>{o.y+=speed*dt*.18});
 for(let i=objects.length-1;i>=0;i--){let o=objects[i];if(collide(o)){if(o.type==='coin'){coins++;state.coins++;objects.splice(i,1);save()}else{end();return}}else if(o.y>H+40)objects.splice(i,1)}
 if(player.jump>0)player.jump=Math.max(0,player.jump-dt*.35);
 draw();updateUI();raf=requestAnimationFrame(loop)}
function move(dir){if(!run)return;player.lane=Math.max(0,Math.min(2,player.lane+dir));player.x=lanes()[player.lane]}
function jump(){if(run&&player.jump===0)player.jump=95}
function start(){document.getElementById('start').style.display='none';document.getElementById('reward').classList.add('hidden');reset();run=true;last=performance.now();raf=requestAnimationFrame(loop)}
function end(){run=false;cancelAnimationFrame(raf);state.best=Math.max(state.best,Math.floor(score));save();document.getElementById('result').innerHTML=`Skor: <b>${Math.floor(score)}</b><br>Koin didapat: <b>${coins} 🪙</b>`;document.getElementById('reward').classList.remove('hidden');updateUI()}
function save(){localStorage.setItem('coinRunner',JSON.stringify(state))}
function updateUI(){document.getElementById('coins').textContent=state.coins.toLocaleString('id-ID');document.getElementById('score').textContent=Math.floor(score);document.getElementById('startCoins').textContent=state.coins.toLocaleString('id-ID')+' 🪙';document.getElementById('best').textContent=state.best}
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;
document.getElementById('bonus').onclick=()=>{if(!state.bonus){state.bonus=true;state.coins+=50;save();updateUI();alert('+50 koin bonus simulasi!')}};
document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.getElementById('jump').onclick=jump;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key===' ')jump()});
let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',e=>{let x=e.changedTouches[0].clientX,y=e.changedTouches[0].clientY,dx=x-sx,dy=y-sy;if(Math.abs(dx)>35)move(dx>0?1:-1);else if(dy<-35)jump()},{passive:true});
updateUI();draw();
</script>
</body>
</html>
